version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: engine_rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build: .
    container_name: engine_auth
    command: uvicorn services.auth.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET_KEY=super-secret-jwt-key-for-dev

  gateway:
    build: .
    container_name: engine_gateway
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth:8001
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started

  worker:
    build: .
    container_name: engine_notification_worker
    command: python -m services.notification.worker
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
