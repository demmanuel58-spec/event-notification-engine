name: Multi-Service CI/CD & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Tests
      run: |
        pytest -v

  security-scan:
    name: Container Security Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Local Image for Security Scan
      run: |
        docker build -t event-engine:local .

    - name: Scan Image for Vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'event-engine:local'
        format: 'table'
        exit-code: '0' # Set to 1 in strict pipelines to break build on critical vulnerabilities
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  build-and-push:
    name: Build & Push Microservice Images to GHCR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Short Git SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and Push Gateway Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/gateway:latest
          ghcr.io/${{ github.repository }}/gateway:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push Auth Service Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/auth:latest
          ghcr.io/${{ github.repository }}/auth:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push Notification Worker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/worker:latest
          ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.sha_short }}
